name: CI - Build Verification

on:
  pull_request:
    # `labeled`: adding the build-binaries label starts the release-binary builds below
    types: [opened, synchronize, reopened, labeled]
    paths:
    - 'lium/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'lium.spec'
    - 'lium_entry.py'
    - 'Dockerfile.build'
    - 'scripts/install.sh'
    - 'test/**'
    - '.github/workflows/ci.yml'
    - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the suite (39 files under test/) was never run by CI; only the binary-target
    # matrix test was. Same install the macOS build already does, minus pyinstaller.
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install
      run: uv sync --frozen --extra dev --extra provider

    # the runner has no ~/.lium and no LIUM_API_KEY, like a fresh laptop: a test that
    # needs either fails here instead of passing on the author's machine only
    - name: Run the test suite
      run: uv run pytest test/ -q -p no:cacheprovider --durations=10

  build-python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build toml

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    - name: Upload Python artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-dist
        path: dist/
        retention-days: 7

  validate-binary-targets:
    name: Validate binary target matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest

    - name: Verify installer and workflow target coverage
      run: pytest test/test_release_binary_targets.py

  # The amd64 bundle is what a developer downloads from a PR and the only exercise of
  # Dockerfile.build, so it builds on every push. The arm64 and macOS bundles are release
  # artefacts (release.yml builds them for a release): here they build on workflow_dispatch
  # or when the PR carries the `build-binaries` label, not on every push of a text change
  # (the two macOS runners were ~90 % of this workflow's cost).
  build-linux-binary:
    name: Build Linux binary (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-latest
          platform: linux/amd64
          asset_name: lium-linux-amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Build Linux bundle in Docker
      run: |
        mkdir -p dist
        rm -rf dist/lium
        docker rm -f lium-extract >/dev/null 2>&1 || true
        docker build --platform ${{ matrix.platform }} -f Dockerfile.build -t lium-build:${GITHUB_SHA}-${{ matrix.asset_name }} .
        docker create --name lium-extract lium-build:${GITHUB_SHA}-${{ matrix.asset_name }} true
        docker cp lium-extract:/app/dist/lium dist/lium
        docker rm -f lium-extract
        tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist lium

    - name: Smoke test Linux bundle
      run: |
        ./dist/lium/lium --version
        ./dist/lium/lium --help >/dev/null

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          dist/${{ matrix.asset_name }}.tar.gz
          dist/${{ matrix.asset_name }}
        retention-days: 7

  build-linux-arm64-binary:
    name: Build Linux binary (lium-linux-arm64)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-binaries')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      ASSET_NAME: lium-linux-arm64
    steps:
    - uses: actions/checkout@v4

    - name: Build Linux bundle in Docker
      run: |
        mkdir -p dist
        rm -rf dist/lium
        docker rm -f lium-extract >/dev/null 2>&1 || true
        docker build --platform linux/arm64 -f Dockerfile.build -t lium-build:${GITHUB_SHA}-${ASSET_NAME} .
        docker create --name lium-extract lium-build:${GITHUB_SHA}-${ASSET_NAME} true
        docker cp lium-extract:/app/dist/lium dist/lium
        docker rm -f lium-extract
        tar -czf dist/${ASSET_NAME}.tar.gz -C dist lium

    - name: Smoke test Linux bundle
      run: |
        ./dist/lium/lium --version
        ./dist/lium/lium --help >/dev/null

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ASSET_NAME }}
        path: |
          dist/${{ env.ASSET_NAME }}.tar.gz
          dist/${{ env.ASSET_NAME }}
        retention-days: 7

  build-macos-binary:
    # no matrix value in the name: a skipped matrix job would show it unexpanded
    name: Build macOS binary
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-binaries')
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-14
          asset_name: lium-darwin-arm64
          expected_machine: arm64
        - runner: macos-15-intel
          asset_name: lium-darwin-amd64
          expected_machine: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Build macOS binary
      run: |
        actual_machine="$(uname -m)"
        if [[ "$actual_machine" != "${{ matrix.expected_machine }}" ]]; then
          echo "Expected macOS runner architecture ${{ matrix.expected_machine }}, got $actual_machine" >&2
          exit 1
        fi
        uv sync --frozen --extra dev --extra provider
        rm -rf dist/lium
        uv run pyinstaller lium.spec --clean
        tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist lium

    - name: Smoke test macOS bundle
      run: |
        ./dist/lium/lium --version
        ./dist/lium/lium --help >/dev/null

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          dist/${{ matrix.asset_name }}.tar.gz
          dist/${{ matrix.asset_name }}
        retention-days: 7

  ci-ok:
    # the one context to require in the ruleset (lium requires none today). The binary
    # builds stay informational: a Debian mirror outage must not block every merge.
    name: ci-ok
    needs: [test, build-python, validate-binary-targets]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
